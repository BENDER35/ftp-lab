name: Mirror a GitLab

# GitHub -> GitLab. El camino inverso lo hace .gitlab-ci.yml.
# Se clona en modo --mirror (repo desnudo) para no tener una rama checked-out:
# asi se pueden empujar todas las refs sin Conflictos. Como no se crean commits,
# cuando ambos repos estan igualados el push es un no-op: no hay bucles.

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  delete:
  workflow_dispatch:

concurrency:
  group: mirror-gitlab-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar este repositorio en modo espejo
        run: |
          git clone --mirror \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            mirror.git

      - name: Empujar ramas y etiquetas a GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: gitlab.com/BENDER_5000/ftp-lab.git
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "Falta el secreto GITLAB_TOKEN en este repositorio."
            exit 1
          fi
          cd mirror.git
          URL="https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}"
          git push --force --prune "$URL" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
          echo "Sincronizado GitHub -> GitLab correctamente."
