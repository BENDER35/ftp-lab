name: Mirror a GitLab

# GitHub -> GitLab. El camino inverso lo hace .gitlab-ci.yml.
# Como se usan empujes directos de refs (sin crear commits), cuando ambos
# repositorios estan igualados el push es un no-op: no hay bucles infinitos.

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  delete:
  workflow_dispatch:

concurrency:
  group: mirror-gitlab-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Empujar ramas y etiquetas a GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: gitlab.com/BENDER_5000/ftp-lab.git
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "Falta el secreto GITLAB_TOKEN en este repositorio."
            exit 1
          fi
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git fetch --prune origin '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          URL="https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}"
          git push --force --prune "$URL" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
          echo "Sincronizado GitHub -> GitLab correctamente."
