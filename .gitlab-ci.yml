# GitLab -> GitHub. El camino inverso lo hace .github/workflows/mirror.yml.
# GIT_STRATEGY: none evita el checkout en HEAD desacoplado: hacemos nosotros un
# clone --mirror y empujamos las refs. Los pushes directos no crean commits,
# asi que si ya estan igualados no se emite un evento nuevo (sin bucles).

stages:
  - mirror

variables:
  GIT_STRATEGY: none

mirror_to_github:
  stage: mirror
  image: alpine:3.20
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache git
  script:
    - |
      if [ -z "${GH_TOKEN:-}" ]; then
        echo "Falta la variable GH_TOKEN en este proyecto de GitLab."
        exit 1
      fi
      git clone --mirror "$CI_REPOSITORY_URL" mirror.git
      cd mirror.git
      URL="https://x-access-token:${GH_TOKEN}@github.com/BENDER35/ftp-lab.git"
      git push --force --prune "$URL" \
        'refs/heads/*:refs/heads/*' \
        'refs/tags/*:refs/tags/*'
      echo "Sincronizado GitLab -> GitHub correctamente."
