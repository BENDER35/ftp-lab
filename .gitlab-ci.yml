# GitLab -> GitHub. El camino inverso lo hace .github/workflows/mirror.yml.
# Los pushes directos de refs no crean commits: si ya estan igualados no se
# emite un nuevo evento y, por tanto, no se produce un bucle.

stages:
  - mirror

variables:
  GIT_DEPTH: "0"
  GIT_STRATEGY: fetch

mirror_to_github:
  stage: mirror
  image: alpine:3.20
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache git
  script:
    - |
      if [ -z "${GH_TOKEN:-}" ]; then
        echo "Falta la variable GH_TOKEN en este proyecto de GitLab."
        exit 1
      fi
      git config user.name "mirror-bot"
      git config user.email "mirror-bot@users.noreply.gitlab.com"
      # El runner deja el checkout en HEAD desacoplado: hay que crear las refs
      # locales antes de empujar, o --prune intentaria borrar la rama remota.
      git fetch --prune origin '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
      URL="https://x-access-token:${GH_TOKEN}@github.com/BENDER35/ftp-lab.git"
      git push --force --prune "$URL" \
        'refs/heads/*:refs/heads/*' \
        'refs/tags/*:refs/tags/*'
      echo "Sincronizado GitLab -> GitHub correctamente."
